<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>نظام صيدلية عسكر</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="theme-color" content="#7d1028">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;700&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
/* Layout: برنامج صيدلية مستقل. 3 طرق عرض: الخريطة (الأقسام والشاشات)، القاعدة (الجداول والقواعد)، جرّب الشاشات.
   الألوان نفس tokens بوت النواقص (ar/app.css)، ومعاها نسخة ليلي. */
:root {
  --crimson: #7d1028;
  --crimson-deep: #560a1b;
  --accent-ink: #6a0d22;
  --rose: #f7e9ec;
  --rose-line: #ead2d8;
  --gold: #c39a3e;
  --paper: #fbf8f8;
  --card: #ffffff;
  --ink: #241518;
  --muted: #76666a;
  --line: #ece3e5;
  --good: #1d6f48;
  --good-bg: #e4f3eb;
  --warn: #8d5b00;
  --warn-bg: #fbf0d9;
  --bad: #a3162f;
  --bad-bg: #fbe4e8;
  --idle: #5f5a5c;
  --idle-bg: #eeeaeb;
  --on-bar: #ffffff;
  --bar: #7d1028;
  --font: 'IBM Plex Sans Arabic', system-ui, -apple-system, 'Segoe UI', Tahoma, sans-serif;
  --mono: 'IBM Plex Mono', ui-monospace, 'SFMono-Regular', Menlo, Consolas, monospace;
  --radius: 16px;
  --nav-h: 68px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --crimson: #7d1028; --crimson-deep: #4a0817; --accent-ink: #f2a7b6; --rose: #3a1f26; --rose-line: #55313b;
    --gold: #d4b05a; --paper: #171012; --card: #22181b; --ink: #f4eaec; --muted: #bba8ad; --line: #3a2b2f;
    --good: #7fd6a6; --good-bg: #173326; --warn: #f1c86f; --warn-bg: #3a2d10; --bad: #ff9aab; --bad-bg: #401a22;
    --idle: #c9c0c2; --idle-bg: #34292c; --on-bar: #ffffff; --bar: #c4465f; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --crimson: #7d1028; --crimson-deep: #4a0817; --accent-ink: #f2a7b6; --rose: #3a1f26; --rose-line: #55313b;
  --gold: #d4b05a; --paper: #171012; --card: #22181b; --ink: #f4eaec; --muted: #bba8ad; --line: #3a2b2f;
  --good: #7fd6a6; --good-bg: #173326; --warn: #f1c86f; --warn-bg: #3a2d10; --bad: #ff9aab; --bad-bg: #401a22;
  --idle: #c9c0c2; --idle-bg: #34292c; --on-bar: #ffffff; --bar: #c4465f; color-scheme: dark;
}
* { box-sizing: border-box; }
html { -webkit-tap-highlight-color: transparent; }
body { margin: 0; font-family: var(--font); font-size: 16px; line-height: 1.65; background: var(--paper); color: var(--ink); }
body.try { padding-bottom: calc(var(--nav-h) + 16px + env(safe-area-inset-bottom, 0px)); }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 30; background: var(--crimson); }
.wrap { max-width: 760px; margin: 0 auto; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
button { font: inherit; cursor: pointer; }
:focus-visible { outline: 3px solid var(--gold); outline-offset: 2px; }
h1, h2, h3 { text-wrap: balance; line-height: 1.35; }
h2 { font-size: 1.12rem; margin: 0; }
h3 { font-size: 0.98rem; margin: 0; }
p { margin: 0; }
.hint { color: var(--muted); font-size: 0.9rem; }
.num, .stat b { font-variant-numeric: tabular-nums; direction: ltr; unicode-bidi: isolate; }
.mono { font-family: var(--mono); font-size: 0.78rem; direction: ltr; unicode-bidi: isolate; color: var(--muted); overflow-wrap: anywhere; }

/* app bar */
.appbar { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 20; background: linear-gradient(160deg, var(--crimson) 0%, var(--crimson-deep) 100%); color: var(--on-bar); border-bottom: 2px solid var(--gold); }
.appbar .wrap { display: flex; align-items: center; gap: 12px; padding-block: 10px; }
.mark { width: 40px; height: 40px; flex: none; border-radius: 12px; display: grid; place-items: center; box-shadow: 0 0 0 1.5px var(--gold); font-weight: 700; font-size: 1.25rem; }
.appbar .titles { flex: 1; min-width: 0; }
.appbar h1 { margin: 0; font-size: 1.15rem; }
.appbar p { font-size: 0.85rem; opacity: 0.85; }
.icon-btn { width: 44px; height: 44px; flex: none; border: 0; border-radius: 12px; display: grid; place-items: center; background: rgba(255,255,255,.12); color: var(--on-bar); }
.icon-btn[aria-pressed="true"] { background: rgba(255,255,255,.28); }
.icon-btn svg { width: 22px; height: 22px; }

/* modes */
.modes { display: flex; gap: 4px; padding: 4px; margin-block: 14px 12px; background: var(--rose); border-radius: 14px; }
.modes button { flex: 1; min-height: 44px; border: 0; border-radius: 11px; background: transparent; color: var(--accent-ink); font-weight: 500; font-size: 0.92rem; }
.modes button[aria-pressed="true"] { background: var(--card); color: var(--ink); font-weight: 700; box-shadow: 0 1px 4px rgba(0,0,0,.08); }
.banner { font-size: 0.85rem; color: var(--warn); background: var(--warn-bg); border-radius: 10px; padding: 8px 12px; margin-bottom: 12px; }

/* badges */
.badge { display: inline-flex; align-items: center; padding: 1px 9px; border-radius: 999px; font-size: 0.75rem; font-weight: 500; white-space: nowrap; }
.a-pos { color: var(--good); background: var(--good-bg); }
.a-admin { color: var(--warn); background: var(--warn-bg); }
.a-mobile { color: var(--accent-ink); background: var(--rose); }
.a-web { color: var(--idle); background: var(--idle-bg); }
.legend { display: flex; flex-wrap: wrap; gap: 6px 10px; margin-top: 8px; }

/* map + db */
.lead { display: grid; gap: 6px; margin-bottom: 12px; }
.section { background: var(--card); border: 1px solid var(--line); border-radius: var(--radius); padding: 14px; margin-bottom: 12px; }
.section > header { display: flex; align-items: center; gap: 10px; margin-bottom: 4px; }
.section > header svg { width: 26px; height: 26px; color: var(--accent-ink); flex: none; }
.section > header .why { font-size: 0.85rem; color: var(--muted); }
.rows { display: grid; margin-top: 6px; }
.row { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 2px 10px; padding-block: 10px; border-top: 1px solid var(--line); }
.row:first-child { border-top: 0; }
.row .name { font-weight: 700; min-width: 0; }
.row .tags { display: flex; gap: 6px; flex-wrap: wrap; justify-content: flex-end; align-items: center; }
.row .what { grid-column: 1 / -1; color: var(--muted); font-size: 0.9rem; min-width: 0; }
.row .mono { grid-column: 1 / -1; }
.rules { margin: 0; padding-inline-start: 20px; display: grid; gap: 6px; }
.rules li::marker { color: var(--gold); font-weight: 700; }
.flow { display: grid; gap: 6px; margin-top: 8px; }
.flow .step { display: grid; grid-template-columns: auto minmax(0, 1fr); gap: 10px; align-items: start; }
.flow .step b { color: var(--accent-ink); }
.flow .arrow { color: var(--gold); font-weight: 700; }
.phases { display: grid; gap: 12px; }
.phase { display: grid; grid-template-columns: auto minmax(0, 1fr); gap: 4px 12px; align-items: start; }
.phase .k { width: 30px; height: 30px; border-radius: 50%; display: grid; place-items: center; background: var(--rose); color: var(--accent-ink); font-weight: 700; }
.phase .goal { font-weight: 700; }
.phase ul { margin: 2px 0 0; padding-inline-start: 18px; font-size: 0.92rem; }

/* try */
.chips { display: flex; gap: 6px; overflow-x: auto; padding-bottom: 6px; margin-bottom: 10px; scrollbar-width: thin; }
.chip { flex: none; min-height: 40px; border: 1px solid var(--rose-line); background: var(--rose); color: var(--accent-ink); border-radius: 999px; padding: 4px 14px; font-size: 0.9rem; }
.chip[aria-pressed="true"] { background: var(--crimson); border-color: var(--crimson); color: var(--on-bar); }
.card { background: var(--card); border: 1px solid var(--line); border-radius: var(--radius); padding: 14px; margin-bottom: 12px; }
.card > header { display: flex; justify-content: space-between; align-items: center; gap: 8px; flex-wrap: wrap; margin-bottom: 6px; }
.list { display: grid; margin-top: 8px; }
.item { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 0 10px; padding-block: 9px; border-top: 1px solid var(--line); }
.item:first-child { border-top: 0; }
.item .t { font-weight: 500; min-width: 0; overflow-wrap: anywhere; }
.item .s { color: var(--muted); font-size: 0.85rem; grid-column: 1; min-width: 0; }
.item .v { grid-row: 1 / span 2; grid-column: 2; align-self: center; text-align: left; font-weight: 700; }
.item.total { border-top: 2px solid var(--ink); }
.pill { font-size: 0.75rem; padding: 1px 8px; border-radius: 999px; font-weight: 500; white-space: nowrap; }
.p-red { color: var(--bad); background: var(--bad-bg); }
.p-yellow { color: var(--warn); background: var(--warn-bg); }
.p-green { color: var(--good); background: var(--good-bg); }
.stats { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; margin-block: 8px; }
.stat { background: var(--rose); border-radius: 12px; padding: 8px 10px; min-width: 0; }
.stat b { display: block; font-size: 1.15rem; color: var(--accent-ink); }
.stat span { font-size: 0.8rem; color: var(--muted); }
.meter { display: block; height: 8px; border-radius: 99px; background: var(--line); overflow: hidden; margin-top: 4px; }
.meter i { display: block; height: 100%; background: var(--good); border-radius: 99px; }
.meter i.over { background: var(--bad); }
.meter i.near { background: var(--warn); }
.bars { display: grid; grid-template-columns: repeat(9, minmax(0, 1fr)); gap: 6px; align-items: end; height: 120px; margin-top: 10px; }
.bars div { display: grid; grid-template-rows: 1fr auto; height: 100%; gap: 4px; min-width: 0; }
.bars i { align-self: end; display: block; background: var(--bar); border-radius: 6px 6px 2px 2px; }
.bars i.now { background: var(--gold); }
.bars span { font-size: 0.7rem; color: var(--muted); text-align: center; font-variant-numeric: tabular-nums; }
.btnrow { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 10px; }
.btn { min-height: 44px; border: 0; border-radius: 12px; padding: 8px 14px; background: var(--crimson); color: var(--on-bar); font-weight: 500; }
.btn.ghost { background: var(--rose); color: var(--accent-ink); }
.note { font-size: 0.85rem; color: var(--muted); border-top: 1px dashed var(--line); margin-top: 10px; padding-top: 8px; }
.scan { display: flex; align-items: center; gap: 8px; border: 1px dashed var(--rose-line); border-radius: 12px; padding: 10px 12px; color: var(--muted); margin-bottom: 4px; }
.scan svg { width: 22px; height: 22px; flex: none; color: var(--accent-ink); }
.offline { display: flex; align-items: center; gap: 8px; font-size: 0.85rem; color: var(--warn); background: var(--warn-bg); border-radius: 10px; padding: 6px 10px; margin-bottom: 8px; }
.offline::before { content: ""; width: 8px; height: 8px; border-radius: 50%; background: var(--warn); flex: none; }

/* bottom nav */
.bottomnav { position: fixed; inset: auto 0 0; z-index: 25; background: var(--card); border-top: 1px solid var(--line); padding-bottom: env(safe-area-inset-bottom, 0px); padding-left: max(4px, env(safe-area-inset-left, 0px)); padding-right: max(4px, env(safe-area-inset-right, 0px)); }
.bottomnav .in { max-width: 760px; margin: 0 auto; display: grid; grid-template-columns: repeat(5, 1fr); height: var(--nav-h); }
.bottomnav button { border: 0; background: transparent; color: var(--muted); display: grid; place-items: center; align-content: center; gap: 2px; font-size: 0.8rem; min-width: 0; }
.bottomnav button svg { width: 24px; height: 24px; }
.bottomnav button[aria-pressed="true"] { color: var(--accent-ink); font-weight: 700; }
@media (prefers-reduced-motion: no-preference) { .chip, .modes button, .bottomnav button { transition: background .15s, color .15s; } }
</style>
</head>
<body>
<header class="appbar">
  <div class="wrap">
    <div class="mark" aria-hidden="true">ع</div>
    <div class="titles">
      <h1>صيدلية عسكر</h1>
      <p>برنامج إدارة الصيدلية · هيكل للمراجعة</p>
    </div>
    <button id="gearBtn" class="icon-btn" type="button" aria-pressed="false" aria-label="الإعدادات" title="الإعدادات">
      <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="3" fill="none" stroke="currentColor" stroke-width="2"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3M4.9 4.9l2.1 2.1M17 17l2.1 2.1M4.9 19.1L7 17M17 7l2.1-2.1" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
    </button>
  </div>
</header>

<div class="wrap">
  <div class="modes" role="group" aria-label="طريقة العرض">
    <button id="modeMap" type="button" aria-pressed="true">الخريطة</button>
    <button id="modeDb" type="button" aria-pressed="false">قاعدة البيانات</button>
    <button id="modeTry" type="button" aria-pressed="false">جرّب الشاشات</button>
  </div>
  <main id="mapView"></main>
  <main id="dbView" hidden></main>
  <main id="tryView" hidden>
    <p class="banner">كل الأرقام والأسماء هنا أمثلة للتوضيح، مش داتا الصيدلية.</p>
    <div id="chips" class="chips" role="group" aria-label="شاشات القسم"></div>
    <div id="panel"></div>
  </main>
</div>

<nav class="bottomnav" id="bottomNav" aria-label="الأقسام" hidden><div class="in" id="navIn"></div></nav>

<script>
'use strict';
// ====================================================================================================
// الهيكل كله هنا: الأقسام ← الشاشات. لكل شاشة: بتعمل إيه، فين (كاشير/إدارة/موبايل/موقع)، وجداولها في القاعدة.
// ====================================================================================================
const APP = {
  pos: ['الكاشير', 'a-pos'],
  admin: ['الإدارة', 'a-admin'],
  mobile: ['الموبايل', 'a-mobile'],
  web: ['الموقع', 'a-web']
};
const ICON = {
  sales: '<path d="M4 7h16v12H4zM4 7l2-3h12l2 3M9 12h6" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>',
  purchases: '<path d="M4 5h2l2 10h10l2-7H7M10 19a1 1 0 1 0 0 .01M17 19a1 1 0 1 0 0 .01" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>',
  stock: '<path d="M3 8l9-5 9 5v10l-9 5-9-5zM3 8l9 5 9-5M12 13v10" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/>',
  accounts: '<path d="M5 4h11l3 3v13H5zM9 9h6M9 13h6M9 17h4" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>',
  reports: '<path d="M4 19h16M7 16V10M12 16V6M17 16v-4" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>',
  settings: '<circle cx="12" cy="12" r="3" fill="none" stroke="currentColor" stroke-width="2"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3M4.9 4.9l2.1 2.1M17 17l2.1 2.1M4.9 19.1L7 17M17 7l2.1-2.1" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>',
  links: '<path d="M10 14a4 4 0 0 0 5.7 0l3-3a4 4 0 0 0-5.7-5.7l-1 1M14 10a4 4 0 0 0-5.7 0l-3 3a4 4 0 0 0 5.7 5.7l1-1" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>',
  scan: '<path d="M4 7V4h3M17 4h3v3M20 17v3h-3M7 20H4v-3M7 8v8M10 8v8M13 8v8M16 8v8" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>'
};

const SECTIONS = [
  {
    id: 'sales', label: 'البيع', icon: 'sales', why: 'الكاشير بيشتغل حتى لو النت وقع.',
    tabs: [
      { id: 'pos', label: 'الكاشير', apps: ['pos'], db: 'post_sale · sales · sale_lines · sale_payments', what: 'باركود أو اسم، بالعلبة أو الشريط، الأقرب صلاحية بيطلع الأول وكل تشغيلة بسعرها. كاش أو فيزا أو محفظة أو آجل على العميل في حدّه.' },
      { id: 'sreturn', label: 'مرتجع البيع', apps: ['pos'], db: 'post_sale_return · sale_returns', what: 'بيرجع لنفس التشغيلة، ومايرجعش أكتر من اللي اتباع. الفلوس كاش أو تتخصم من حساب العميل.' },
      { id: 'shifts', label: 'الورديات', apps: ['pos', 'admin'], db: 'open_shift · close_shift · shifts', what: 'فتح الدرج وقفله: المفروض كام واللي اتعدّ كام، والفرق بيتسجل.' },
      { id: 'online', label: 'طلبات الموقع والتوصيل', apps: ['mobile', 'pos'], db: 'online_orders · store_place_order', what: 'الطلب بيوصل بسعر القاعدة، تأكده، يطلع مع المندوب، ولما يتحصّل يبقى بيع عادي.' },
      { id: 'controlled', label: 'سجل أدوية الجدول', apps: ['admin'], db: 'controlled_register', what: 'بيتكتب لوحده مع كل بيع لصنف جدول، ومفيش بيع من غير اسم المريض والدكتور.' }
    ]
  },
  {
    id: 'purchases', label: 'المشتريات', icon: 'purchases', why: 'البوت بيقرا ويكتب هنا على طول.',
    tabs: [
      { id: 'shortages', label: 'النواقص', apps: ['mobile', 'admin'], db: 'v_shortages · item_stock_rules · shortage_marks', what: 'بتتحسب لحظيًا من الرصيد والبيع. مفيش ملف ولا لاب. الكمية اللي تكتبها بتكسب، و«أجّل لحد …».' },
      { id: 'offers', label: 'عروض الموردين', apps: ['mobile'], db: 'supplier_offers · supplier_item_names', what: 'وارد الواتس وقوايم المخازن بتتسجل على أصنافنا مباشرة، بالخصم والكوتة.' },
      { id: 'orders', label: 'الطلبيات', apps: ['mobile', 'admin'], db: 'purchase_orders · v_best_offer', what: 'كل صنف عند المورد اللي خصمه أحسن (آخر عرض أو آخر فاتورة فعلية). «اتطلب» = طلبية اتبعتت.' },
      { id: 'pinvoices', label: 'فواتير الشرا', apps: ['admin', 'mobile'], db: 'post_purchase_invoice · purchase_invoices', what: 'صورة الفاتورة من الواتس ← مسودة ← تراجعها ← ترحيل: تشغيلات جديدة بالصلاحية والسعر والتكلفة بعد البونص، ورصيد المورد بيزيد.' },
      { id: 'preturns', label: 'مرتجع للمورد', apps: ['admin'], db: 'post_purchase_return · purchase_returns', what: 'صلاحية أو تالف أو غلط: المخزون بيقل ورصيد المورد بيقل، ومعاه رقم الإشعار.' }
    ]
  },
  {
    id: 'stock', label: 'المخزن', icon: 'stock', why: 'كل حركة سطر في دفتر، والرصيد عمره ما يبقى بالسالب.',
    tabs: [
      { id: 'items', label: 'الأصناف', apps: ['admin', 'mobile'], db: 'items · item_barcodes · generics · price_changes', what: 'كارت الصنف: إنجليزي وعربي ونطق، باركود أكتر من واحد، المادة الفعالة والبدايل، جدول/روشتة/تلاجة، وتاريخ الأسعار.' },
      { id: 'balances', label: 'الأرصدة', apps: ['mobile', 'admin', 'pos'], db: 'v_stock · stock_balances', what: 'علب + وحدات لكل تشغيلة ومكان، ومخزن الانتظار لوحده.' },
      { id: 'expiry', label: 'الصلاحية', apps: ['mobile', 'admin'], db: 'v_expiring', what: 'المنتهي مابيتباعش أصلًا. اللي فاضله أقل من 3 شهور قدامك، ومعاه المورد عشان المرتجع.' },
      { id: 'itemcard', label: 'كارت حركة الصنف', apps: ['admin'], db: 'v_item_card · stock_moves', what: 'كل دخول وخروج للصنف والرصيد بعده.' },
      { id: 'transfers', label: 'التحويل', apps: ['admin'], db: 'post_transfer · transfers', what: 'من مخزن الانتظار للرئيسي أو العكس.' },
      { id: 'counts', label: 'الجرد', apps: ['admin', 'mobile'], db: 'post_stock_count · stock_counts', what: 'جرد رف أو تصنيف، والفرق بيتسجل حركة.' }
    ]

function due(name, owe, limit) {
  const pct = Math.min(100, Math.round((owe / limit) * 100));
  const cls = owe > limit ? 'over' : pct >= 80 ? 'near' : '';
  const tag = owe > limit ? ' <span class="pill p-red">عدّى الحد</span>' : '';
  return `<div class="item"><span class="t">${name}${tag}</span><span class="s">الحد ${num(limit.toLocaleString('en-US'))}<span class="meter" aria-hidden="true"><i class="${cls}" style="width:${pct}%"></i></span></span><span class="v">${num(owe.toLocaleString('en-US'))}</span></div>`;
}
function bars(rows, nowIndex) {
  return `<div class="bars" role="img" aria-label="البيع بالساعة النهارده (مثال)">${rows.map(([h, v], i) => `<div><i class="${i === nowIndex ? 'now' : ''}" style="height:${v}%"></i><span>${h}</span></div>`).join('')}</div>`;
}

      <div class="legend">${Object.keys(APP).map((a) => `<span class="badge ${APP[a][1]}">${APP[a][0]}</span>`).join('')}</div>

  document.getElementById('modeDb').setAttribute('aria-pressed', String(mode === 'db'));
  document.getElementById('modeTry').setAttribute('aria-pressed', String(mode === 'try'));
  document.getElementById('bottomNav').hidden = mode !== 'try';
  document.body.classList.toggle('try', mode === 'try');
  if (mode === 'try') { drawNav(); drawSection(); }
  try { localStorage.setItem('asker-ph-mode', mode); } catch (e) { /* التخزين مقفول: عادي */ }
}
function go(section) {
  state.section = section;
  drawNav(); drawSection();
  window.scrollTo({ top: 0 });
}

document.getElementById('modeMap').addEventListener('click', () => setMode('map'));
document.getElementById('modeDb').addEventListener('click', () => setMode('db'));
document.getElementById('modeTry').addEventListener('click', () => setMode('try'));
document.getElementById('gearBtn').addEventListener('click', () => { setMode('try'); go(state.section === 'settings' ? 'sales' : 'settings'); });
document.getElementById('navIn').addEventListener('click', (e) => { const b = e.target.closest('button[data-sec]'); if (b) go(b.dataset.sec); });
document.getElementById('chips').addEventListener('click', (e) => {
  const b = e.target.closest('button[data-tab]');
  if (!b) return;
  state.tab[state.section] = b.dataset.tab;
  drawSection();
});

drawMap();
drawDb();
let start = 'map';
try { const m = localStorage.getItem('asker-ph-mode'); if (m === 'db' || m === 'try') start = m; } catch (e) { /* عادي */ }
setMode(start);
</script>
</body>
</html>
