# PostgREST على كمبيوتر الصيدلية. القيم اللي بين <> بيكتبها التسطيب (مابتترفعش على GitHub).
db-uri = "postgres://authenticator:<AUTHENTICATOR_PASSWORD>@127.0.0.1:5432/asker"
db-schemas = "ph"
db-anon-role = "anon"
db-pre-request = "auth.check_request"
jwt-secret = "<JWT_SECRET (نفس auth.config.jwt_secret، 32 حرف على الأقل)>"
server-host = "127.0.0.1"
server-port = 3000
db-pool = 10
